---
eck-elasticsearch:
  fullnameOverride: b
  version: 9.2.5
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: monitoring
    logs:
      elasticsearchRefs:
        - name: monitoring
  http:
    service:
      spec:
        type: LoadBalancer
  secureSettings:
    - secretName: keystore
  nodeSets:
    - name: master
      count: 1
      config:
        node.roles:
          - master
          - remote_cluster_client
      podTemplate:
        metadata:
          labels: &labels
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: &serviceAccountName elasticsearch
          initContainers: &initContainers
            - name: sysctl
              securityContext:
                privileged: true
                runAsUser: 0
              command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 2Gi
              env: &env
                - name: AZURE_FEDERATED_TOKEN_FILE
                  value: /usr/share/elasticsearch/config/azure/tokens/azure-identity-token
              volumeMounts: &volumeMounts
                - name: azure-identity-token
                  mountPath: /usr/share/elasticsearch/config/azure/tokens
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
            storageClassName: managed-csi-premium
    - name: data
      count: 1
      config:
        node.roles:
          - data_hot
          - data_cold
          - data_frozen
          - data_content
          - ingest
          - remote_cluster_client
      podTemplate:
        metadata:
          labels: *labels
        spec:
          serviceAccountName: *serviceAccountName
          initContainers: *initContainers
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  memory: 2Gi
              env: *env
              volumeMounts: *volumeMounts
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 30Gi
            storageClassName: managed-csi-premium
  transport:
    service:
      metadata:
        annotations:
          service.beta.kubernetes.io/azure-load-balancer-internal: "true"
      spec:
        type: LoadBalancer
    tls:
      certificateAuthorities:
        configMapName: remote-certs
eck-kibana:
  fullnameOverride: b
  version: 9.2.5
  elasticsearchRef:
    name: b
  monitoring:
    metrics:
      elasticsearchRefs:
        - name: monitoring
    logs:
      elasticsearchRefs:
        - name: monitoring
  count: 1
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
  config:
    server.publicBaseUrl: https://b.foo.com # Replaced in the deploy script.
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "https"
    pathType: Prefix
    hosts:
      - host: b.foo.com # Replaced in the deploy script.
        paths: /
